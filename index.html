<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You Flowers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #04040b;
      --bg2: #0b0820;
      --bg3: #14061d;
      --stem: rgba(186, 194, 235, 0.18);
      --leaf1: #4e772b;
      --leaf2: #7aac38;
      --petal1: #ff8c8c;
      --petal2: #ff4d5e;
      --petal3: #a70023;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 85%, rgba(112, 0, 255, 0.12), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(76, 0, 255, 0.18), transparent 28%),
        linear-gradient(to bottom, var(--bg1), var(--bg2) 55%, var(--bg3));
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .scene {
      position: relative;
      width: min(92vw, 700px);
      height: min(95vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .scene::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100, 0, 255, 0.16), transparent 65%);
      filter: blur(30px);
      z-index: 0;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(255, 70, 70, 0.08));
    }

    .stem,
    .branch {
      fill: none;
      stroke: var(--stem);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: sway 5.5s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    .branch.delay1 { animation-delay: .3s; }
    .branch.delay2 { animation-delay: .8s; }
    .branch.delay3 { animation-delay: 1.2s; }
    .branch.delay4 { animation-delay: 1.7s; }

    .leaf {
      fill: url(#leafGrad);
      filter: drop-shadow(0 0 8px rgba(118, 194, 67, 0.1));
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation:
        leafShow .9s ease forwards,
        leafWave 4s ease-in-out infinite alternate;
      animation-delay: var(--leafDelay), calc(var(--leafDelay) + 1s);
    }

    .flower {
      animation: floatFlower 4.2s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .flower.f1 { animation-delay: .2s; }
    .flower.f2 { animation-delay: .8s; }
    .flower.f3 { animation-delay: 1.4s; }
    .flower.f4 { animation-delay: 2s; }

    .petal {
      fill: url(#petalGrad);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter:
        drop-shadow(0 0 8px rgba(255, 70, 70, 0.5))
        drop-shadow(0 0 20px rgba(255, 40, 40, 0.18));
      animation:
        bloom 0.85s cubic-bezier(.2,.85,.2,1) forwards,
        petalPulse 3s ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) + 1.1s);
    }

    .center {
      fill: #15060d;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255, 70, 70, 0.28));
      animation: centerPop .6s ease forwards;
      animation-delay: calc(var(--delay) + .45s);
    }

    .spark {
      fill: rgba(255, 215, 235, 0.9);
      opacity: 0;
      animation: twinkle 2.3s ease-in-out infinite;
      animation-delay: var(--sparkDelay);
      filter: blur(.5px);
    }

    .for-you {
      font-size: 30px;
      fill: rgba(255,255,255,0.92);
      opacity: 0;
      letter-spacing: 1.5px;
      font-style: italic;
      animation:
        textShow 1.3s ease forwards,
        glowText 2s ease-in-out infinite;
      animation-delay: 2.9s, 4.2s;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.15));
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      opacity: 0;
      user-select: none;
      animation: floatUp linear infinite;
      text-shadow:
        0 0 8px currentColor,
        0 0 16px currentColor;
    }

    .particle.heart {
      color: rgba(255, 106, 140, 0.75);
    }

    .particle.star {
      color: rgba(255, 230, 170, 0.78);
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: rotate(var(--rot)) scale(0.05);
      }
      70% {
        opacity: 1;
        transform: rotate(var(--rot)) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--rot)) scale(1);
      }
    }

    @keyframes centerPop {
      0% {
        opacity: 0;
        transform: scale(0.1);
      }
      80% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes petalPulse {
      0%, 100% {
        transform: rotate(var(--rot)) scale(1);
      }
      50% {
        transform: rotate(var(--rot)) scale(1.03);
      }
    }

    @keyframes sway {
      from { transform: rotate(-1.2deg); }
      to   { transform: rotate(1.4deg); }
    }

    @keyframes leafShow {
      from {
        opacity: 0;
        transform: scale(0.2) rotate(-12deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes leafWave {
      from { transform: rotate(-3deg) scale(1); }
      to   { transform: rotate(3deg) scale(1.03); }
    }

    @keyframes floatFlower {
      from { transform: translateY(0px); }
      to   { transform: translateY(-6px); }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .15;
        transform: scale(.7);
      }
      50% {
        opacity: .95;
        transform: scale(1.35);
      }
    }

    @keyframes textShow {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowText {
      0%, 100% {
        filter:
          drop-shadow(0 0 5px rgba(255,255,255,0.2))
          drop-shadow(0 0 10px rgba(255,120,180,0.18));
      }
      50% {
        filter:
          drop-shadow(0 0 8px rgba(255,255,255,0.45))
          drop-shadow(0 0 18px rgba(255,120,180,0.35))
          drop-shadow(0 0 28px rgba(255,120,180,0.2));
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(.6) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: .95;
      }
      100% {
        transform: translateY(-105vh) scale(1.2) rotate(20deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="particles" id="particles"></div>

    <svg viewBox="0 0 700 900" aria-label="Glowing flowers">
      <defs>
        <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9a9a" />
          <stop offset="40%" stop-color="#ff5463" />
          <stop offset="100%" stop-color="#a10025" />
        </linearGradient>

        <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#85b33f" />
          <stop offset="100%" stop-color="#43651f" />
        </linearGradient>
      </defs>

      <!-- sparkles -->
      <circle class="spark" cx="250" cy="235" r="2.2" style="--sparkDelay:.2s"></circle>
      <circle class="spark" cx="478" cy="214" r="2.1" style="--sparkDelay:1.2s"></circle>
      <circle class="spark" cx="565" cy="345" r="1.8" style="--sparkDelay:.8s"></circle>
      <circle class="spark" cx="190" cy="405" r="2.3" style="--sparkDelay:1.6s"></circle>
      <circle class="spark" cx="510" cy="500" r="1.7" style="--sparkDelay:2s"></circle>

      <!-- stems -->
      <path class="stem" d="M355 775 C355 665 355 575 355 470 C355 360 352 270 350 175" />
      <path class="branch delay1" d="M355 475 C308 435 275 393 240 337" />
      <path class="branch delay2" d="M355 520 C425 480 485 430 532 375" />
      <path class="branch delay3" d="M355 600 C300 575 250 530 205 475" />
      <path class="branch delay4" d="M355 650 C430 615 495 550 548 478" />

      <!-- leaves -->
      <path class="leaf" style="--leafDelay:1.9s" d="M308 640 C255 658 250 712 301 732 C339 736 352 689 308 640 Z" />
      <path class="leaf" style="--leafDelay:2.1s" d="M401 637 C452 650 468 700 417 724 C378 731 359 682 401 637 Z" />

      <!-- main flower -->
      <g class="flower f1" transform="translate(390 240) scale(1.24)">
        <ellipse class="petal" style="--rot:0deg;--delay:.2s" cx="0" cy="-60" rx="34" ry="72"/>
        <ellipse class="petal" style="--rot:90deg;--delay:.45s" cx="60" cy="0" rx="34" ry="72"/>
        <ellipse class="petal" style="--rot:180deg;--delay:.7s" cx="0" cy="60" rx="34" ry="72"/>
        <ellipse class="petal" style="--rot:270deg;--delay:.95s" cx="-60" cy="0" rx="34" ry="72"/>
        <circle class="center" style="--delay:.95s" cx="0" cy="0" r="17"/>
      </g>

      <!-- left flower -->
      <g class="flower f2" transform="translate(238 355) scale(.84)">
        <ellipse class="petal" style="--rot:0deg;--delay:1.05s" cx="0" cy="-52" rx="28" ry="56"/>
        <ellipse class="petal" style="--rot:72deg;--delay:1.2s" cx="49" cy="-8" rx="28" ry="56"/>
        <ellipse class="petal" style="--rot:144deg;--delay:1.35s" cx="30" cy="42" rx="28" ry="56"/>
        <ellipse class="petal" style="--rot:216deg;--delay:1.5s" cx="-30" cy="42" rx="28" ry="56"/>
        <ellipse class="petal" style="--rot:288deg;--delay:1.65s" cx="-49" cy="-8" rx="28" ry="56"/>
        <circle class="center" style="--delay:1.65s" cx="0" cy="0" r="13"/>
      </g>

      <!-- right flower -->
      <g class="flower f3" transform="translate(530 392) scale(.74)">
        <ellipse class="petal" style="--rot:0deg;--delay:1.85s" cx="0" cy="-50" rx="26" ry="52"/>
        <ellipse class="petal" style="--rot:72deg;--delay:2s" cx="47" cy="-8" rx="26" ry="52"/>
        <ellipse class="petal" style="--rot:144deg;--delay:2.15s" cx="28" cy="40" rx="26" ry="52"/>
        <ellipse class="petal" style="--rot:216deg;--delay:2.3s" cx="-28" cy="40" rx="26" ry="52"/>
        <ellipse class="petal" style="--rot:288deg;--delay:2.45s" cx="-47" cy="-8" rx="26" ry="52"/>
        <circle class="center" style="--delay:2.45s" cx="0" cy="0" r="12"/>
      </g>

      <!-- top small flower -->
      <g class="flower f4" transform="translate(272 220) scale(.36)">
        <ellipse class="petal" style="--rot:0deg;--delay:2.15s" cx="0" cy="-46" rx="23" ry="48"/>
        <ellipse class="petal" style="--rot:90deg;--delay:2.3s" cx="46" cy="0" rx="23" ry="48"/>
        <ellipse class="petal" style="--rot:180deg;--delay:2.45s" cx="0" cy="46" rx="23" ry="48"/>
        <ellipse class="petal" style="--rot:270deg;--delay:2.6s" cx="-46" cy="0" rx="23" ry="48"/>
        <circle class="center" style="--delay:2.6s" cx="0" cy="0" r="12"/>
      </g>

      <text class="for-you" x="350" y="835" text-anchor="middle"> احبك على طريقه مهنديسن هذا الورد لك يقلبي </text>
    </svg>
  </div>

  <script>
    const particles = document.getElementById("particles");
    const symbols = [
      { char: "❤", cls: "heart" },
      { char: "♥", cls: "heart" },
      { char: "✦", cls: "star" },
      { char: "✧", cls: "star" },
      { char: "★", cls: "star" }
    ];

    function createParticle() {
      const p = document.createElement("span");
      const pick = symbols[Math.floor(Math.random() * symbols.length)];

      p.className = `particle ${pick.cls}`;
      p.textContent = pick.char;
      p.style.left = Math.random() * 100 + "%";
      p.style.fontSize = (12 + Math.random() * 16) + "px";
      p.style.animationDuration = (6 + Math.random() * 5) + "s";
      p.style.animationDelay = "0s";

      particles.appendChild(p);

      setTimeout(() => {
        p.remove();
      }, 12000);
    }

    for (let i = 0; i < 18; i++) {
      setTimeout(createParticle, i * 350);
    }

    setInterval(createParticle, 550);
  </script>
</body>
          </html>
