<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وردتي لك</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #02020a;
      --bg2: #07051a;
      --bg3: #14032a;
      --stem: rgba(175, 183, 230, 0.22);
      --leaf1: #9acb3c;
      --leaf2: #5d8c22;
      --petal1: #ff8da1;
      --petal2: #ff5f7b;
      --petal3: #ff3f65;
      --petal4: #d81f46;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 70%, rgba(96, 0, 255, 0.12), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(67, 0, 185, 0.22), transparent 32%),
        linear-gradient(to bottom, var(--bg1), var(--bg2) 52%, var(--bg3));
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: min(100vw, 700px);
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .scene::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107, 0, 255, 0.16), transparent 65%);
      filter: blur(28px);
      z-index: 0;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .stem,
    .branch {
      fill: none;
      stroke: var(--stem);
      stroke-width: 3;
      stroke-linecap: round;
      animation: sway 5.5s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    .leaf {
      fill: url(#leafGrad);
      filter: drop-shadow(0 0 10px rgba(140, 255, 80, 0.08));
      opacity: 0;
      animation: leafShow .9s ease forwards;
      animation-delay: 2.2s;
      transform-origin: center;
    }

    .leaf.right {
      animation-delay: 2.35s;
    }

    .flower-main {
      animation: floatFlower 4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .petal {
      fill: url(#petalGrad);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter:
        drop-shadow(0 0 8px rgba(255, 90, 120, 0.8))
        drop-shadow(0 0 18px rgba(255, 70, 110, 0.45))
        drop-shadow(0 0 30px rgba(255, 50, 90, 0.22));
      animation:
        bloom .9s cubic-bezier(.2,.85,.2,1) forwards,
        petalPulse 3s ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) + 1.1s);
    }

    .flower-center {
      fill: #14040a;
      opacity: 0;
      animation: centerPop .6s ease forwards;
      animation-delay: 1.25s;
      filter: drop-shadow(0 0 10px rgba(255, 90, 120, 0.25));
    }

    .spark {
      position: absolute;
      color: rgba(255, 230, 170, 0.85);
      text-shadow:
        0 0 6px currentColor,
        0 0 14px currentColor;
      opacity: 0;
      animation: twinkle 2.6s ease-in-out infinite;
      z-index: 3;
      user-select: none;
      pointer-events: none;
    }

    .spark.heart {
      color: rgba(255, 105, 160, 0.85);
    }

    .msg {
      position: absolute;
      left: 50%;
      bottom: 130px;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: rgba(255,255,255,0.95);
      font-size: clamp(20px, 3.7vw, 34px);
      line-height: 1.8;
      z-index: 4;
      opacity: 0;
      animation:
        textShow 1.2s ease forwards,
        glowText 2.2s ease-in-out infinite;
      animation-delay: 2.8s, 4.2s;
      text-shadow:
        0 0 6px rgba(255,255,255,0.25),
        0 0 16px rgba(203, 131, 255, 0.22);
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: rotate(var(--rot)) scale(0.05);
      }
      70% {
        opacity: 1;
        transform: rotate(var(--rot)) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--rot)) scale(1);
      }
    }

    @keyframes centerPop {
      0% {
        opacity: 0;
        transform: scale(0.1);
      }
      80% {
        opacity: 1;
        transform: scale(1.12);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes petalPulse {
      0%, 100% {
        transform: rotate(var(--rot)) scale(1);
      }
      50% {
        transform: rotate(var(--rot)) scale(1.03);
      }
    }

    @keyframes sway {
      from { transform: rotate(-1.2deg); }
      to   { transform: rotate(1.4deg); }
    }

    @keyframes leafShow {
      from {
        opacity: 0;
        transform: scale(0.2) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes floatFlower {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: translateY(0) scale(.8);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px) scale(1.18);
      }
    }

    @keyframes textShow {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes glowText {
      0%, 100% {
        text-shadow:
          0 0 6px rgba(255,255,255,0.25),
          0 0 16px rgba(203, 131, 255, 0.22);
      }
      50% {
        text-shadow:
          0 0 8px rgba(255,255,255,0.45),
          0 0 18px rgba(255,255,255,0.22),
          0 0 30px rgba(203, 131, 255, 0.34);
      }
    }

    .particle {
      position: absolute;
      bottom: -25px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      animation: floatUp linear infinite;
      text-shadow:
        0 0 6px currentColor,
        0 0 14px currentColor;
    }

    .particle.heart {
      color: rgba(255, 106, 160, 0.8);
    }

    .particle.star {
      color: rgba(255, 230, 170, 0.82);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(.65) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: .95;
      }
      100% {
        transform: translateY(-110vh) scale(1.15) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <svg viewBox="0 0 700 1200" aria-label="flower greeting">
      <defs>
        <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9dad" />
          <stop offset="38%" stop-color="#ff6e87" />
          <stop offset="72%" stop-color="#ff4a6f" />
          <stop offset="100%" stop-color="#d81f46" />
        </linearGradient>

        <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a7d544" />
          <stop offset="100%" stop-color="#5f8d24" />
        </linearGradient>
      </defs>

      <!-- الوردة أعلى اليسار -->
      <g class="flower-main" transform="translate(55 300) scale(1.45)">
        <ellipse class="petal" style="--rot:0deg;--delay:.15s" cx="0" cy="-74" rx="34" ry="78"/>
        <ellipse class="petal" style="--rot:60deg;--delay:.35s" cx="64" cy="-20" rx="34" ry="78"/>
        <ellipse class="petal" style="--rot:120deg;--delay:.55s" cx="42" cy="54" rx="34" ry="78"/>
        <ellipse class="petal" style="--rot:180deg;--delay:.75s" cx="-20" cy="72" rx="34" ry="78"/>
        <ellipse class="petal" style="--rot:240deg;--delay:.95s" cx="-62" cy="24" rx="34" ry="78"/>
        <ellipse class="petal" style="--rot:300deg;--delay:1.15s" cx="-48" cy="-42" rx="34" ry="78"/>
        <circle class="flower-center" cx="2" cy="3" r="14"/>
      </g>

      <!-- الساق -->
      <path class="stem" d="M350 980 C350 880 350 770 348 650 C346 540 344 455 342 390" />
      <path class="branch" d="M345 690 C285 645 250 605 220 560" />
      <path class="branch" d="M348 635 C415 590 455 545 495 500" />
      <path class="branch" d="M349 805 C420 765 460 720 505 670" />

      <!-- الأوراق -->
      <path class="leaf left" d="M280 820 C238 838 226 900 276 934 C323 950 347 894 314 835 C304 825 293 820 280 820 Z" />
      <path class="leaf right" d="M401 820 C442 838 455 900 405 934 C360 950 336 894 367 835 C377 825 388 820 401 820 Z" />
    </svg>

    <div class="msg">احبك على طريقه مهندسين هذا الورد لك بقلبي</div>
  </div>

  <script>
    const scene = document.querySelector(".scene");

    const fixedSparkles = [
      { x: 205, y: 450, t: "✦", c: "star", s: 18, d: .4 },
      { x: 515, y: 395, t: "❤", c: "heart", s: 16, d: .9 },
      { x: 590, y: 250, t: "✦", c: "star", s: 18, d: 1.5 },
      { x: 120, y: 770, t: "❤", c: "heart", s: 13, d: .6 },
      { x: 600, y: 760, t: "✦", c: "star", s: 18, d: 1.2 },
      { x: 245, y: 915, t: "✦", c: "star", s: 20, d: 1.8 },
      { x: 455, y: 940, t: "✧", c: "star", s: 16, d: 2.1 },
      { x: 360, y: 890, t: "❤", c: "heart", s: 16, d: 1.7 },
      { x: 85, y: 230, t: "✦", c: "star", s: 14, d: .8 },
      { x: 165, y: 575, t: "✧", c: "star", s: 14, d: 1.1 },
      { x: 560, y: 610, t: "❤", c: "heart", s: 19, d: .7 }
    ];

    fixedSparkles.forEach(item => {
      const el = document.createElement("span");
      el.className = `spark ${item.c}`;
      el.textContent = item.t;
      el.style.left = item.x + "px";
      el.style.top = item.y + "px";
      el.style.fontSize = item.s + "px";
      el.style.animationDelay = item.d + "s";
      scene.appendChild(el);
    });

    const symbols = [
      { char: "❤", cls: "heart" },
      { char: "♥", cls: "heart" },
      { char: "✦", cls: "star" },
      { char: "✧", cls: "star" }
    ];

    function createParticle() {
      const p = document.createElement("span");
      const pick = symbols[Math.floor(Math.random() * symbols.length)];
      p.className = `particle ${pick.cls}`;
      p.textContent = pick.char;
      p.style.left = (Math.random() * 92 + 4) + "%";
      p.style.fontSize = (12 + Math.random() * 14) + "px";
      p.style.animationDuration = (6 + Math.random() * 5) + "s";
      scene.appendChild(p);

      setTimeout(() => p.remove(), 12000);
    }

    for (let i = 0; i < 12; i++) {
      setTimeout(createParticle, i * 500);
    }

    setInterval(createParticle, 750);
  </script>
</body>
</html>
