<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وردة لك</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Tahoma", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 72%, rgba(83, 0, 170, 0.18), transparent 16%),
        radial-gradient(circle at 50% 100%, rgba(55, 0, 140, 0.28), transparent 30%),
        linear-gradient(to bottom, #02020b 0%, #050515 45%, #120326 100%);
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 80%, rgba(74, 0, 170, 0.08), transparent 18%);
    }

    .floor-glow {
      position: absolute;
      left: 50%;
      bottom: 12vh;
      transform: translateX(-50%);
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(102, 0, 255, 0.22), transparent 68%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
    }

    .plant {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .stem,
    .branch {
      fill: none;
      stroke: rgba(180, 188, 235, 0.22);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: sway 6s ease-in-out infinite alternate;
      transform-origin: 50% 100%;
    }

    .branch.b2 { animation-delay: .4s; }
    .branch.b3 { animation-delay: .8s; }
    .branch.b4 { animation-delay: 1.1s; }

    .leaf {
      filter: drop-shadow(0 0 10px rgba(137, 255, 41, 0.05));
      transform-origin: center;
      opacity: 0;
      animation: leafShow .8s ease forwards;
      animation-delay: 1.8s;
    }

    .leaf.right {
      animation-delay: 2s;
    }

    .flower-main {
      transform-origin: center;
      animation: flowerFloat 4s ease-in-out infinite alternate;
    }

    .petal {
      fill: url(#petalGrad);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter:
        drop-shadow(0 0 7px rgba(255, 92, 128, 0.95))
        drop-shadow(0 0 18px rgba(255, 84, 125, 0.60))
        drop-shadow(0 0 30px rgba(255, 70, 110, 0.24));
      animation:
        bloom .9s cubic-bezier(.2,.85,.2,1) forwards,
        pulse 3s ease-in-out infinite;
      animation-delay: var(--d), calc(var(--d) + 1.05s);
    }

    .flower-center {
      fill: #120308;
      opacity: 0;
      animation: centerPop .55s ease forwards;
      animation-delay: 1s;
      filter: drop-shadow(0 0 10px rgba(255, 80, 120, 0.25));
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 16vh;
      transform: translateX(-50%);
      width: 88vw;
      max-width: 560px;
      text-align: center;
      color: #fff;
      font-size: clamp(18px, 2.8vw, 32px);
      line-height: 1.8;
      z-index: 5;
      opacity: 0;
      animation:
        textIn 1.2s ease forwards,
        textGlow 2.2s ease-in-out infinite;
      animation-delay: 2.3s, 3.5s;
      text-shadow:
        0 0 5px rgba(255,255,255,.25),
        0 0 14px rgba(255,255,255,.18),
        0 0 24px rgba(203, 126, 255, .18);
      pointer-events: none;
      white-space: nowrap;
    }

    .fixed {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: twinkle 2.7s ease-in-out infinite;
      text-shadow:
        0 0 7px currentColor,
        0 0 16px currentColor;
    }

    .star {
      color: rgba(255, 232, 176, 0.90);
    }

    .heart {
      color: rgba(255, 112, 165, 0.88);
    }

    .particle {
      position: absolute;
      bottom: -25px;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: floatUp linear forwards;
      text-shadow:
        0 0 6px currentColor,
        0 0 14px currentColor;
    }

    .particle.star {
      color: rgba(255, 232, 176, 0.85);
    }

    .particle.heart {
      color: rgba(255, 112, 165, 0.82);
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: rotate(var(--r)) scale(.05);
      }
      70% {
        opacity: 1;
        transform: rotate(var(--r)) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--r)) scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: rotate(var(--r)) scale(1);
      }
      50% {
        transform: rotate(var(--r)) scale(1.03);
      }
    }

    @keyframes centerPop {
      0% {
        opacity: 0;
        transform: scale(.12);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes leafShow {
      from {
        opacity: 0;
        transform: scale(.2) rotate(-12deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes flowerFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-5px); }
    }

    @keyframes sway {
      from { transform: rotate(-0.8deg); }
      to   { transform: rotate(1deg); }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .18;
        transform: translateY(0) scale(.85);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px) scale(1.15);
      }
    }

    @keyframes textIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes textGlow {
      0%, 100% {
        text-shadow:
          0 0 5px rgba(255,255,255,.25),
          0 0 14px rgba(255,255,255,.18),
          0 0 24px rgba(203, 126, 255, .18);
      }
      50% {
        text-shadow:
          0 0 8px rgba(255,255,255,.55),
          0 0 18px rgba(255,255,255,.28),
          0 0 30px rgba(203, 126, 255, .34);
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(.65) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: .95;
      }
      100% {
        transform: translateY(-105vh) scale(1.15) rotate(20deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="floor-glow"></div>

    <svg class="plant" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9ed53f"/>
          <stop offset="100%" stop-color="#5f8d23"/>
        </linearGradient>

        <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9fb0"/>
          <stop offset="40%" stop-color="#ff6f8c"/>
          <stop offset="75%" stop-color="#ff4d72"/>
          <stop offset="100%" stop-color="#d91d47"/>
        </linearGradient>
      </defs>

      <!-- الساق -->
      <path class="stem" d="M50 80 C50 71, 50 61, 49.9 52 C49.8 43, 49.5 35, 49.2 27" />

      <!-- الأغصان -->
      <path class="branch b1" d="M49.8 55 C43.5 49.5, 38.5 43.5, 32.2 34.8" />
      <path class="branch b2" d="M49.9 49.5 C56 45.5, 61.2 40.5, 66.5 35.5" />
      <path class="branch b3" d="M49.9 63 C43.4 59.2, 38.1 54.5, 33.3 48.5" />
      <path class="branch b4" d="M50 70 C56.5 66.2, 61.8 61.2, 67.4 55.5" />

      <!-- الأوراق -->
      <path class="leaf left" fill="url(#leafGrad)"
        d="M39 69.8
           C35.5 70.7, 33.2 73.8, 33.3 77.1
           C33.5 80.7, 36.5 83, 40.2 82.6
           C43.8 82.2, 45.3 79.1, 44.7 75.8
           C44.1 72.6, 42.2 70.5, 39 69.8 Z" />

      <path class="leaf right" fill="url(#leafGrad)"
        d="M57.8 69.8
           C61.2 70.8, 63.2 73.9, 63.1 77.2
           C63 80.8, 60 83.1, 56.2 82.7
           C52.7 82.3, 51 79.2, 51.6 75.9
           C52.2 72.7, 54.3 70.6, 57.8 69.8 Z" />

      <!-- الوردة مرتبطة بنهاية الغصن العلوي الأيسر -->
      <g class="flower-main" transform="translate(32.2 34.8) scale(0.78)">
        <ellipse class="petal" style="--r:0deg;--d:.15s" cx="0" cy="-9" rx="4.8" ry="10.8"/>
        <ellipse class="petal" style="--r:60deg;--d:.35s" cx="7.8" cy="-2.6" rx="4.8" ry="10.8"/>
        <ellipse class="petal" style="--r:120deg;--d:.55s" cx="5.2" cy="7.2" rx="4.8" ry="10.8"/>
        <ellipse class="petal" style="--r:180deg;--d:.75s" cx="-1.7" cy="9.2" rx="4.8" ry="10.8"/>
        <ellipse class="petal" style="--r:240deg;--d:.95s" cx="-7.2" cy="3.2" rx="4.8" ry="10.8"/>
        <ellipse class="petal" style="--r:300deg;--d:1.15s" cx="-5.7" cy="-5.2" rx="4.8" ry="10.8"/>
        <circle class="flower-center" cx="0" cy="0" r="2.2"/>
      </g>
    </svg>

    <div class="message">احبك على طريقة مهندسين هذا الورد لك بقلبي</div>
  </div>

  <script>
    const scene = document.querySelector('.scene');

    const fixedItems = [
      { x: '22%', y: '28%', t: '❤', cls: 'heart', s: 14, d: .3 },
      { x: '78%', y: '39%', t: '✦', cls: 'star',  s: 18, d: .8 },
      { x: '66%', y: '31%', t: '✦', cls: 'star',  s: 16, d: 1.1 },
      { x: '70%', y: '43%', t: '❤', cls: 'heart', s: 14, d: 1.5 },
      { x: '82%', y: '56%', t: '❤', cls: 'heart', s: 18, d: .6 },
      { x: '27%', y: '48%', t: '✦', cls: 'star',  s: 20, d: 1.8 },
      { x: '15%', y: '72%', t: '❤', cls: 'heart', s: 12, d: .9 },
      { x: '29%', y: '72.5%', t: '❤', cls: 'heart', s: 13, d: 1.2 },
      { x: '38%', y: '80%', t: '✦', cls: 'star',  s: 18, d: .7 },
      { x: '56%', y: '78%', t: '❤', cls: 'heart', s: 16, d: 1.6 },
      { x: '72%', y: '82%', t: '✧', cls: 'star',  s: 15, d: 1.3 },
      { x: '84%', y: '71%', t: '✦', cls: 'star',  s: 17, d: .4 },
      { x: '59%', y: '51%', t: '✧', cls: 'star',  s: 11, d: 1.9 },
      { x: '46%', y: '52%', t: '•', cls: 'star',  s: 16, d: .5 },
      { x: '65%', y: '61%', t: '❤', cls: 'heart', s: 17, d: 1.4 }
    ];

    fixedItems.forEach(item => {
      const el = document.createElement('span');
      el.className = `fixed ${item.cls}`;
      el.textContent = item.t;
      el.style.left = item.x;
      el.style.top = item.y;
      el.style.fontSize = item.s + 'px';
      el.style.animationDelay = item.d + 's';
      scene.appendChild(el);
    });

    const symbols = [
      { char: '❤', cls: 'heart' },
      { char: '♥', cls: 'heart' },
      { char: '✦', cls: 'star' },
      { char: '✧', cls: 'star' }
    ];

    function createParticle() {
      const p = document.createElement('span');
      const pick = symbols[Math.floor(Math.random() * symbols.length)];
      p.className = `particle ${pick.cls}`;
      p.textContent = pick.char;
      p.style.left = (Math.random() * 86 + 7) + '%';
      p.style.fontSize = (10 + Math.random() * 10) + 'px';
      p.style.animationDuration = (7 + Math.random() * 4) + 's';
      scene.appendChild(p);
      setTimeout(() => p.remove(), 12000);
    }

    for (let i = 0; i < 10; i++) {
      setTimeout(createParticle, i * 550);
    }

    setInterval(createParticle, 900);
  </script>
</body>
          </html>
